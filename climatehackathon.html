    <style>
        :root {
            --primary-color: #00d4ff;
            --secondary-color: #0056b3;
            --dark: #0a0e27;
            --light: #ffffff;
            --accent-red: #ff3b30;
            --glass: rgba(255, 255, 255, 0.05);
            --gradient: linear-gradient(135deg, #00d4ff, #0056b3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a237e 100%);
            color: var(--light);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Navigation */
        nav {
            background: rgba(10, 14, 39, 0.98);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
        }

        .logo span {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1.2rem;
            background: linear-gradient(90deg, #FC466B 0%, #3F5EFB 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .home-btn {
            background: var(--accent-red);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 59, 48, 0.3);
        }

        .home-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 59, 48, 0.5);
        }

        /* Hero Section */
        .hero {
            padding: 120px 20px 60px;
            text-align: center;
            position: relative;
        }

        .hero h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(to right, #fff, #00d4ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .congrats-banner {
            background: var(--glass);
            display: inline-block;
            padding: 15px 40px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
            border-left: 4px solid var(--primary-color);
            animation: fadeInDown 1s ease-out;
        }

        .congrats-banner h2 {
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        /* Table Container */
        .table-container {
            max-width: 1200px;
            margin: 0 auto 100px;
            padding: 0 20px;
        }

        .results-table-wrapper {
            background: var(--glass);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            overflow-x: auto;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            color: #e0e0e0;
        }

        th {
            text-align: left;
            padding: 20px;
            border-bottom: 2px solid rgba(0, 212, 255, 0.3);
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            color: var(--primary-color);
        }

        td {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.95rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(0, 212, 255, 0.05);
            color: white;
        }

        .status-badge {
            background: rgba(0, 255, 127, 0.1);
            color: #00ff7f;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(0, 255, 127, 0.2);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.2rem;
            }

            .congrats-banner {
                padding: 10px 20px;
            }

            .congrats-banner h2 {
                font-size: 1.1rem;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
